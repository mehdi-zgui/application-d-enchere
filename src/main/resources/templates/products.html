<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enchères en cours — Auction App</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div th:replace="fragments/header :: header"></div>

  <div class="container" style="max-width:1000px;">

    <!-- Search bar -->
    <form th:action="@{/products}" method="get" class="search-form">
      <input type="text" name="keyword" placeholder="Rechercher par titre…"
             th:value="${keyword}" class="form-control-inline"/>
      <input type="text" name="category" placeholder="Filtrer par catégorie…"
             th:value="${category}" class="form-control-inline"/>
      <button type="submit" class="btn-primary-inline">Rechercher</button>
      <a th:href="@{/products}" class="btn-secondary-inline">Réinitialiser</a>
    </form>

    <!-- Section heading -->
    <div class="section-header">
      <h2>Enchères en cours</h2>
      <a th:href="@{/products/add}" sec:authorize="hasRole('SELLER')"
         class="btn btn-primary small">+ Nouveau lot</a>
    </div>

    <!-- Products table -->
    <table class="table">
      <thead>
        <tr>
          <th>Lot</th>
          <th>Catégorie</th>
          <th>Mise à prix</th>
          <th>Clôture</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${products}">
          <td>
            <a th:href="@{|/products/${p.id}|}" th:text="${p.title}" class="link"></a>
          </td>
          <td>
            <span style="font-size:0.8rem;background:var(--surface-3);padding:0.2rem 0.6rem;border-radius:3px;color:var(--text-muted);"
                  th:text="${p.category}"></span>
          </td>
          <td style="color:var(--gold);font-family:'Playfair Display',serif;"
              th:text="${p.initialPrice} + ' €'"></td>
          <td style="font-size:0.85rem;"
              th:text="${#temporals.format(p.endDate, 'dd/MM/yyyy HH:mm')}"></td>
          <td style="text-align:right;">
            <a th:href="@{|/bids/${p.id}|}" class="btn btn-secondary small">Voir enchères</a>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(products)}"
         style="text-align:center;padding:3rem 0;color:var(--text-muted);">
      <p style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:0.5rem;">Aucun lot trouvé</p>
      <p style="font-size:0.85rem;">Modifiez vos critères de recherche ou revenez plus tard.</p>
    </div>

  </div>
</body>
</html>
